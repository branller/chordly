name: chordly
description: Cancionero offline para músicos de parroquia.

publish_to: "none"

version: 1.0.1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^16.0.0

  # Base de datos (si realmente la vas a usar)
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39

  # Preferencias
  shared_preferences: ^2.5.3

  # Tipografías
  google_fonts: ^6.3.1
  
  # Cargar Archivos
  file_picker: ^10.3.2

  # Leer carpetas
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true

  assets:
    - assets/songs/
